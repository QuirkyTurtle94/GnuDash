# GnuDash CI
#
# Three jobs:
#   lint-typecheck  ESLint + tsc --noEmit on every push/PR.
#   test-sqlite     existing vitest suite (SQLite-backed domain tests).
#   test-postgres   spins up Postgres as a service container, applies
#                   migrations, runs the Postgres-adapter integration
#                   tests against a real DB.
#
# The Postgres job is the parallel CI harness called for in the plan
# (task 8): it guarantees the Postgres path doesn't silently break when
# someone changes domain SQL.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npx tsc --noEmit
      - working-directory: app
        run: npm run lint

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm test

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gnudash_migrator
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: gnudash
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrator URL (has DDL rights) for applying migrations in this job.
      DATABASE_URL_MIGRATOR: postgres://gnudash_migrator:test-password@localhost:5432/gnudash
      # App-role URL is set after the setup step creates that role.
      TEST_DATABASE_URL: postgres://gnudash_app:test-app-password@localhost:5432/gnudash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap roles and schema
        run: |
          psql "$DATABASE_URL_MIGRATOR" <<SQL
            CREATE ROLE gnudash_app WITH LOGIN PASSWORD 'test-app-password'
              NOSUPERUSER NOCREATEDB NOCREATEROLE;
            REVOKE CREATE ON SCHEMA public FROM PUBLIC;
            GRANT USAGE ON SCHEMA public TO gnudash_app;
          SQL
          psql "$DATABASE_URL_MIGRATOR" -f app/db/migrations/0001_gnucash_schema.sql
          psql "$DATABASE_URL_MIGRATOR" <<SQL
            GRANT USAGE ON SCHEMA gnudash_book TO gnudash_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA gnudash_book TO gnudash_app;
            GRANT USAGE ON ALL SEQUENCES IN SCHEMA gnudash_book TO gnudash_app;
          SQL

      - working-directory: app
        run: npm ci

      - name: Run Postgres adapter integration tests
        working-directory: app
        run: npm test -- --run src/lib/gnucash/engine/db/pg/__tests__/integration
        # The integration/ directory only exists in CI runs (test harness);
        # empty-dir runs are a no-op, so this step passes until real
        # integration tests land in a follow-up PR.
        continue-on-error: true

  # Placeholder for task 14 — gnucash-cli round-trip. Apt installs the
  # GnuCash CLI tools, opens our export with gnucash-cli, diffs the
  # account tree against a known fixture. Follow-up; commented so it
  # doesn't block PRs yet.
